<script>
/* 이 파일은 '문' 역할만 합니다. 화면 본체는 DB에 있어서, 열 때마다 최신 버전을 받아옵니다.
   → 관제판을 고쳐도 이 파일은 다시 배포할 필요가 없습니다. */
fetch('https://pogrtghqsxryphfkyfgb.supabase.co/functions/v1/board/px?k=seonkwa2026',
 {method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({conn:'main',path:'op_settings?key=eq.board_html&select=value',method:'GET'})})
.then(function(r){if(!r.ok)throw new Error('서버 응답 '+r.status);return r.json();})
.then(function(rows){
  var h=rows&&rows[0]&&rows[0].value&&rows[0].value.html;
  if(!h){document.body.textContent='화면이 아직 업로드되지 않았습니다.';return;}
  document.open();document.write(h);document.close();})
.catch(function(e){document.body.innerHTML='불러오지 못했습니다: '+e.message+'<br>새로고침(F5) 해보세요.';});
</script>
</body>
